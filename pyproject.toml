[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "angelica"
version = "1.3.9"
description = "Open-source platform for steady isothermal, non-isothermal, and compressible pipe network simulation."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.20",
  "scipy>=1.9",
  "sv-ttk>=2.5",
  "openpyxl>=3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
]

[project.gui-scripts]
angelica-gui = "angelica.gui:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
