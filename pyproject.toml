[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "angelica"
version = "1.6.60"
description = "Open-source platform for steady isothermal, non-isothermal, compressible, and black-oil pipe network simulation."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
  {name = "Simon Rodriguez", email = "simonrodriguezgas@gmail.com"},
]
keywords = ["pipe network", "hydraulics", "fluid mechanics", "CFD", "steady state", "simulation", "pipeline"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Education",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Scientific/Engineering",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
]
dependencies = [
  "numpy>=1.20",
  "scipy>=1.9",
  "thermo>=0.5",
]

[project.urls]
Homepage = "https://scimonCFD.github.io/Angelica_website/"
Source = "https://github.com/ScimonCFD/Angelica"
"Bug Tracker" = "https://github.com/ScimonCFD/Angelica/issues"

[project.optional-dependencies]
gui = [
  "sv-ttk>=2.5",
  "openpyxl>=3.0",
]
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "ruff>=0.4",
  "mypy>=1.0",
]

[project.gui-scripts]
angelica-gui = "angelica.gui:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
angelica = [
  "py.typed",
  "tutorials/**/*.gui.json",
  "tutorials/**/*.py",
  "tutorials/**/*.md",
]
