[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "angelica"
version = "0.1.0"
description = "Steady incompressible network-flow solver prototype."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.20",
  "sv-ttk>=2.5",
  "openpyxl>=3.0",
]

[project.gui-scripts]
angelica-gui = "angelica.gui:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
