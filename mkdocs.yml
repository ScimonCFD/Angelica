site_name: Angelica
site_description: Open-source steady-state pipe network simulator
site_url: https://scimonCFD.github.io/Angelica/
repo_url: https://github.com/ScimonCFD/Angelica
repo_name: ScimonCFD/Angelica
docs_dir: docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            members_order: source

nav:
  - Home: index.md
  - User Guide:
    - Solvers: guide/solvers.md
    - Fluid Models: guide/fluids.md
    - Network Setup: guide/network.md
  - API Reference:
    - Case & Components: api/case.md
    - Solvers: api/solvers.md
    - Fluid Properties: api/properties.md
    - Results: api/results.md
    - Numerics: api/numerics.md
  - Internals: WORKFLOW_AND_EQUATIONS.md
